spring.application.name=sigip-catalog-service
server.port=${PORT:8094}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT y seguridad compartida con SIGIP-Common
sigip.jwt.secret=${JWT_SECRET}
sigip.security.public-get-paths=/api/v1/categorias,/api/v1/categorias/**,/api/v1/servicios,/api/v1/servicios/**

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.cache-names=servicios,servicio,categorias
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,recordStats
sigip.catalogo.datos-demo=${CATALOGO_DATOS_DEMO:true}

# Eureka y monitorización
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
